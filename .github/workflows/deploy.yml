name: Deploy

on:
  workflow_dispatch: # run manually

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy docker-compose-ui.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose-ui.yml"
          target: "~/motorsiot-deploy/"

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "🔑 Logging into GHCR..."
            echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📂 Switching to deploy directory..."
            mkdir -p ~/motorsiot-deploy
            cd ~/motorsiot-deploy

            echo "⬇️ Pulling latest images..."
            docker compose -f docker-compose-ui.yml pull

            echo "🛑 Stopping old stack..."
            docker compose -f docker-compose-ui.yml down

            echo "🚀 Starting updated stack..."
            docker compose -f docker-compose-ui.yml up -d

            echo "🧹 Cleaning up unused Docker resources..."
            docker system prune -af --volumes || true